name: Think Tank staging read-only browser acceptance

on:
  push:
    branches: [secondary-school-platform-foundation]
    paths:
      - ".github/workflows/think-tank-staging-browser.yml"
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: "Existing staging service base URL (no trailing slash)"
        required: true
        default: "https://learnwise-staging-api.onrender.com"

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        working-directory: secondary-school-platform/browser-acceptance
        run: npm install
      - name: Install Chromium
        working-directory: secondary-school-platform/browser-acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify R2 synthetic object is not anonymously readable
        env:
          R2_PUBLIC_OBJECT_URL: https://pub-09ee0a4e92a445889e76a1ca94db79a3.r2.dev/qa-acceptance/think-tank-r2-anon-20261108.txt
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$R2_PUBLIC_OBJECT_URL")
          echo "Anonymous R2 object HTTP status: $code"
          case "$code" in
            403|404) echo "Anonymous object access is denied." ;;
            *) echo "::error::Expected 403 or 404 for a private R2 object; received $code"; exit 1 ;;
          esac
      # Keep this live-service workflow read-only. The authenticated.spec.js suite
      # creates/publishes an assessment and writes export/privacy-request records;
      # run that suite only against isolated disposable fixtures, never live staging.
      - name: Run read-only staging browser acceptance
        working-directory: secondary-school-platform/browser-acceptance
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
        run: npx playwright test staging.spec.js
      - name: Upload browser report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: think-tank-staging-browser-acceptance
          path: |
            secondary-school-platform/browser-acceptance/playwright-report/
            secondary-school-platform/browser-acceptance/test-results/
          if-no-files-found: ignore
          retention-days: 14
