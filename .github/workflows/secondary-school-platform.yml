name: Secondary-school platform checks

on:
  push:
    branches:
      - secondary-school-platform-foundation
    paths:
      - "secondary-school-platform/**"
      - ".github/workflows/secondary-school-platform.yml"
  pull_request:
    paths:
      - "secondary-school-platform/**"
      - ".github/workflows/secondary-school-platform.yml"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secondary-school-platform/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: secondary-school-platform/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API and database configuration tests
        run: python -m unittest -v
