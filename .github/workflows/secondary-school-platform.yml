name: Secondary-school platform checks

on:
  push:
    branches: [secondary-school-platform-foundation]
    paths:
      - "secondary-school-platform/**"
      - ".github/workflows/secondary-school-platform.yml"
  pull_request:
    paths:
      - "secondary-school-platform/**"
      - ".github/workflows/secondary-school-platform.yml"

permissions:
  contents: read

jobs:
  staging-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Render staging health without changing service state
        env:
          STAGING_HEALTH_URL: https://learnwise-staging-api.onrender.com/health
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/think-tank-health.json"
          set +e
          http_code=$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --output "$response" --write-out '%{http_code}' "$STAGING_HEALTH_URL")
          curl_status=$?
          set -e
          if [ "$curl_status" -ne 0 ]; then
            echo "::error::Public /health transport request failed (curl exit $curl_status); health is unverified, not assumed down."
            exit 1
          fi
          echo "HTTP status: $http_code"
          python - "$response" "$http_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          path, code, summary = sys.argv[1:]
          try:
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except Exception:
              print("Health response was not valid JSON.")
              raise SystemExit(1)
          status = payload.get("status")
          mode = payload.get("mode")
          service = payload.get("service")
          print(f"JSON status={status!r}; mode={mode!r}; service={service!r}")
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write(f"### Public staging health\n- HTTP: {code}\n- JSON status: {status}\n- mode: {mode}\n- service: {service}\n")
          if code != "200" or status != "ok" or not isinstance(mode, str) or not mode or not isinstance(service, str) or not service:
              raise SystemExit("Public staging health assertion failed.")
          PY
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnwise_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learnwise_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: secondary-school-platform/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: secondary-school-platform/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and security tests
        run: python -m unittest -v
      - name: Check Python, frontend/admin JavaScript and operations script syntax
        run: |
          python -m compileall -q .
          python check_frontend_scripts.py
          bash -n ../ops/backup_restore_rehearsal.sh
      - name: Rehearse all PostgreSQL migrations on a disposable database
        env:
          LEARNWISE_REHEARSAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
        run: python rehearse_migrations.py
      - name: Rehearse guarded backup and restore to a disposable local database
        env:
          PGPASSWORD: postgres
          SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
          RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thinktank_restore_rehearsal
          CONFIRM_RESTORE_TARGET: thinktank_restore_rehearsal
        run: |
          createdb -h localhost -U postgres thinktank_restore_rehearsal
          bash ../ops/backup_restore_rehearsal.sh
          restored_migrations=$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM learnwise_schema_migrations")
          test "$restored_migrations" = "22"
      - name: Run PostgreSQL schema integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
          LEARNWISE_REHEARSAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
        run: python -m unittest -v test_postgres_schema_integration
      - name: Run PostgreSQL assessment and payment end-to-end tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
        run: python -m unittest -v test_postgres_end_to_end
      - name: Run PostgreSQL registration-to-results student journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
        run: python -m unittest -v test_postgres_student_journey
      - name: Seed disposable authenticated browser fixtures
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
          AUTH_RATE_LIMIT_PEPPER: ci-only-pepper-not-a-real-secret-000000000000
          CI_STUDENT_PASSWORD: Ephemeral-CI-Student-Password-Only-2026!
        run: python ../browser-acceptance/seed_fixtures.py
      - name: Set up Node for authenticated browser acceptance
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        working-directory: secondary-school-platform/browser-acceptance
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Start API against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
          APP_ENV: development
          AUTH_RATE_LIMIT_PEPPER: ci-only-pepper-not-a-real-secret-000000000000
          PUBLIC_APP_URL: http://127.0.0.1:8000
        run: |
          nohup gunicorn --bind 127.0.0.1:8000 --workers 1 --threads 4 app:app >/tmp/thinktank-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/thinktank-api.log
          exit 1
      - name: Run anonymous and authenticated browser acceptance on disposable fixtures
        working-directory: secondary-school-platform/browser-acceptance
        env:
          STAGING_BASE_URL: http://127.0.0.1:8000
          CI_ADMIN_EMAIL: ci-owner@thinktank.invalid
          CI_ADMIN_PASSWORD: Ephemeral-CI-Admin-Password-Only-2026!
          CI_STUDENT_EMAIL: ci-student@thinktank.invalid
          CI_STUDENT_PASSWORD: Ephemeral-CI-Student-Password-Only-2026!
        run: npm test
      - name: Capture API diagnostics on browser failure
        if: failure()
        run: tail -n 200 /tmp/thinktank-api.log || true
      - name: Upload local browser report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: think-tank-local-browser-acceptance
          path: |
            secondary-school-platform/browser-acceptance/playwright-report/
            secondary-school-platform/browser-acceptance/test-results/
          if-no-files-found: ignore
          retention-days: 14

  container-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build application container without publishing
        uses: docker/build-push-action@v6
        with:
          context: secondary-school-platform
          file: secondary-school-platform/backend/Dockerfile
          push: false
          tags: learnwise-api:ci
