name: Secondary-school platform checks

on:
  push:
    branches: [secondary-school-platform-foundation]
    paths:
      - "secondary-school-platform/**"
      - ".github/workflows/secondary-school-platform.yml"
  pull_request:
    paths:
      - "secondary-school-platform/**"
      - ".github/workflows/secondary-school-platform.yml"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnwise_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learnwise_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: secondary-school-platform/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: secondary-school-platform/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and security tests
        run: python -m unittest -v
      - name: Rehearse all PostgreSQL migrations on a disposable database
        env:
          LEARNWISE_REHEARSAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learnwise_rehearsal
        run: python rehearse_migrations.py
