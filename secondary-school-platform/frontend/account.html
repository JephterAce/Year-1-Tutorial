<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="learnwise-api-base" content=""><title>Learnwise account</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:40px auto;padding:20px}.brand{font-size:24px;font-weight:800;color:#172746;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #e3e9f2;border-radius:16px;padding:22px}h1{font-size:28px}h2{font-size:18px;margin:0 0 14px}form{display:grid;gap:10px}input,select,button{font:inherit;padding:11px 12px;border:1px solid #dce3ed;border-radius:9px}button{background:#172746;color:white;border:0;font-weight:700;cursor:pointer}.consent{display:flex;gap:8px;align-items:flex-start;font-size:13px}.consent input{margin-top:3px}.msg{min-height:24px;color:#43516a;font-size:13px}.muted{color:#65738a;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{margin:10px auto}}
</style></head><body><main class="wrap"><div class="brand">Learnwise</div><h1>Your student account</h1><p class="muted">Register with an email address you can access. Email verification is required before sign-in.</p>
<div class="grid"><section class="card"><h2>Create account</h2><form id="register">
<input name="display_name" required minlength="2" maxlength="80" placeholder="Display name">
<input name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="Username">
<input name="email" required type="email" maxlength="254" placeholder="Email address">
<select name="class_level" required><option value="">Choose class</option><option>SS1</option><option>SS2</option><option>SS3</option></select>
<input name="password" required type="password" minlength="12" maxlength="128" placeholder="Password (12–128 characters)">
<label class="consent"><input name="accept_terms" type="checkbox" required> I agree to the Terms of Service.</label>
<label class="consent"><input name="accept_privacy" type="checkbox" required> I have read the Privacy Notice.</label>
<button>Create account</button></form><p class="msg" id="registerMsg" aria-live="polite"></p></section>
<section class="card"><h2>Sign in</h2><form id="login"><input name="email" required type="email" placeholder="Email address"><input name="password" required type="password" placeholder="Password"><button>Sign in</button></form><p class="msg" id="loginMsg" aria-live="polite"></p>
<hr style="border:0;border-top:1px solid #e3e9f2;margin:18px 0"><h2>Reset password</h2><form id="resetRequest"><input name="email" required type="email" placeholder="Account email"><button>Send reset link</button></form><p class="msg" id="resetMsg" aria-live="polite"></p><form id="resetComplete" hidden><input name="password" required type="password" minlength="12" maxlength="128" placeholder="New password"><button>Set new password</button></form>
<p id="sessionMsg" class="msg">You are not signed in.</p><button id="logout" type="button" hidden>Sign out</button></section></div>
<p class="muted">Use only the official Learnwise website. Never share your password or verification link.</p></main>
<script>
const apiBase=(document.querySelector('meta[name="learnwise-api-base"]').content||location.origin).replace(/\/$/,'');
async function api(path,body,method='POST',headers={}){const r=await fetch(apiBase+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json',...headers},body:body===undefined?undefined:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.error||'Request failed.');return d}
function values(form){return Object.fromEntries(new FormData(form).entries())}
function msg(id,s){document.getElementById(id).textContent=s}
document.getElementById('register').onsubmit=async e=>{e.preventDefault();const d=values(e.currentTarget);d.accept_terms=e.currentTarget.accept_terms.checked;d.accept_privacy=e.currentTarget.accept_privacy.checked;try{await api('/api/v1/auth/register',d);msg('registerMsg','If the details are eligible, a verification email will be sent.')}catch(x){msg('registerMsg',x.message)}};
document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/v1/auth/login',values(e.currentTarget));msg('loginMsg','Signed in.');await refresh()}catch(x){msg('loginMsg',x.message)}};
document.getElementById('resetRequest').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/v1/auth/password-reset',values(e.currentTarget));msg('resetMsg',d.message)}catch{msg('resetMsg','If an eligible account exists, reset instructions will be sent.')}};
document.getElementById('resetComplete').onsubmit=async e=>{e.preventDefault();try{await api('/api/v1/auth/password-reset/complete',{token:e.currentTarget.dataset.token,new_password:e.currentTarget.password.value});msg('resetMsg','Password updated. Sign in with your new password.')}catch(x){msg('resetMsg',x.message)}};
function cookie(n){const v=document.cookie.split('; ').find(x=>x.startsWith(n+'='));return v?decodeURIComponent(v.slice(n.length+1)):''}
async function refresh(){try{const d=await api('/api/v1/auth/me',undefined,'GET');msg('sessionMsg','Signed in as '+d.student.display_name+' · '+d.student.class_level);document.getElementById('logout').hidden=false}catch{msg('sessionMsg','You are not signed in.');document.getElementById('logout').hidden=true}}
document.getElementById('logout').onclick=async()=>{try{await api('/api/v1/auth/logout',{},'POST',{'X-CSRF-Token':cookie('learnwise_csrf')});await refresh()}catch(x){msg('sessionMsg',x.message)}};
const token=new URLSearchParams(location.search).get('token');
if(new URLSearchParams(location.search).get('action')==='verify'&&token){api('/api/v1/auth/verify-email',{token}).then(()=>{history.replaceState({},'',location.pathname);msg('registerMsg','Email verified. You can now sign in.');}).catch(()=>msg('registerMsg','Verification link is invalid or expired.'))}
if(new URLSearchParams(location.search).get('action')==='reset'&&token){document.getElementById('resetComplete').hidden=false;document.getElementById('resetComplete').dataset.token=token;history.replaceState({},'',location.pathname+'?action=reset');}
refresh();
</script></body></html>
